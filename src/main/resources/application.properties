# ADDS configuration. Every value can be overridden by an environment variable.
# Credentials are NEVER written here: they come only from DB_USER and DB_PASSWORD.
spring.application.name=adds

# Web server (override with the SERVER_PORT environment variable)
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
spring.threads.virtual.enabled=true

# Database: URL from ADDS_DB_URL (default addsdb), user and password from env only, no defaults
spring.datasource.url=${ADDS_DB_URL:jdbc:postgresql://localhost:5432/addsdb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HikariCP pool: bounded, far below PostgreSQL max_connections=100
spring.datasource.hikari.pool-name=adds-pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.auto-commit=true
# Same session rules on every pooled connection: DB clock zone and the three timeouts
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'; SET lock_timeout = '2s'; SET statement_timeout = '5s'; SET idle_in_transaction_session_timeout = '10s'

# ADDS fall-back defaults (real business numbers will come from config_rules)
adds.hold.seconds=300
adds.retry.max=3

# Request id in every log line (filled by RequestIdFilter in Step 3)
logging.pattern.level=%5p [rid=%X{requestId:-none}]
